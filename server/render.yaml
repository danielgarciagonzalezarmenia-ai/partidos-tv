services:
  - type: web
    name: partidos-tv-api
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: MATCHES_URL
        value: https://raw.githubusercontent.com/danielgarciagonzalezarmenia-ai/partidos-tv/main/matches.json
      - key: GITHUB_REPO
        value: danielgarciagonzalezarmenia-ai/partidos-tv
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_TOKEN
        sync: false
      - key: CACHE_TTL
        value: "300"
