<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SportTV - Listas M3U8 diarias</title>
<style>
  :root{
    --bg:#0a0d13; --panel:#121722; --panel-2:#161c28; --line:#222b3a;
    --text:#e8ecf3; --muted:#9aa6b8; --accent:#19c37d; --accent-2:#0e9c63;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #11203a 0%, var(--bg) 55%) fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}
  header{display:flex;align-items:center;gap:14px;padding:14px 0 22px}
  .logo{width:42px;height:42px;flex:0 0 auto}
  .brand{font-size:26px;font-weight:800;letter-spacing:.5px}
  .brand small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.3px;margin-top:2px}
  .tag{margin:0 0 26px;color:var(--muted);font-size:15px;max-width:640px}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 16px}
  .section-head h2{font-size:18px;margin:0;font-weight:700}
  .count{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:var(--radius);padding:18px;
    display:flex;flex-direction:column;gap:12px;transition:transform .15s ease,border-color .15s ease;
  }
  .card:hover{transform:translateY(-2px);border-color:#2f3c52}
  .date{font-size:19px;font-weight:700}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--accent);
    background:rgba(25,195,125,.12);border:1px solid rgba(25,195,125,.35);padding:2px 8px;border-radius:999px}
  .meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
  .btn{
    margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:#04130c;font-weight:700;text-decoration:none;
    padding:11px 14px;border-radius:10px;border:none;cursor:pointer;font-size:14px;
    transition:background .15s ease;
  }
  .btn:hover{background:var(--accent-2)}
  .btn svg{width:16px;height:16px;fill:currentColor}
  .empty{color:var(--muted);text-align:center;padding:48px 0;border:1px dashed var(--line);border-radius:var(--radius)}
  footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--text)}
  @media (max-width:560px){
    .wrap{padding:20px 14px 48px}
    .brand{font-size:22px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="22" fill="#19c37d"/>
      <path d="M20 16 L34 24 L20 32 Z" fill="#04130c"/>
    </svg>
    <div class="brand">SportTV<small>Listas M3U8 para tus proyectos de deportes</small></div>
  </header>

  <p class="tag">Descarga la lista del dia. Cada archivo esta identificado por su fecha para que siempre sepas cual corresponde a hoy.</p>

  <div class="section-head">
    <h2>Listas disponibles</h2>
    <span class="count" id="count"></span>
  </div>

  <div id="lists" class="grid"></div>

  <footer>
    <span>SportTV</span>
    <a href="/admin">Acceso administrador</a>
  </footer>
</div>

<script>
function fmtSize(b){
  if(b < 1024) return b + " B";
  if(b < 1024*1024) return (b/1024).toFixed(1) + " KB";
  return (b/1024/1024).toFixed(2) + " MB";
}
function card(m){
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <div class="date">${m.label || m.date}</div>
      <span class="badge">M3U8</span>
    </div>
    <div class="meta"><span>${m.date}</span><span>${fmtSize(m.size)}</span></div>
    <a class="btn" href="/lists/${m.filename}" download>
      <svg viewBox="0 0 24 24"><path d="M12 3v10m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Descargar
    </a>`;
  return el;
}
fetch("/api/lists").then(r=>r.json()).then(d=>{
  const box = document.getElementById("lists");
  document.getElementById("count").textContent = d.count + (d.count===1?" lista":" listas");
  if(!d.lists.length){
    box.innerHTML = `<div class="empty">Aun no hay listas publicadas.</div>`;
    return;
  }
  d.lists.forEach(m=>box.appendChild(card(m)));
}).catch(()=>{
  document.getElementById("lists").innerHTML = `<div class="empty">No se pudieron cargar las listas.</div>`;
});
</script>
</body>
</html>
